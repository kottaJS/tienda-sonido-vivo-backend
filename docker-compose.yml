services:
  mysql:
    image: mysql:8.0
    container_name: sonido-vivo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sonido_vivo_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
